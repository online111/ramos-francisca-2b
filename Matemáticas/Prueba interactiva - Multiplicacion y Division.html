<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba interactiva | Multiplicación y División</title>
<style>
:root{--morado:#7434a8;--violeta:#a64bd1;--rosado:#ff6eaa;--tinta:#38234f;--fondo:#fff7fc;--verde:#178c59;--rojo:#d74554}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff5fc 0%,#f3ebff 45%,#e8fbfb 100%);font-family:Nunito,Arial,sans-serif;color:var(--tinta);min-height:100vh}.hero{background:linear-gradient(100deg,var(--morado),var(--rosado));color:white;padding:28px 18px 32px;text-align:center;box-shadow:0 3px 12px #8e4a9a55}.hero h1{margin:0;font-size:clamp(1.6rem,5vw,2.5rem)}.hero p{margin:.5rem 0 0;font-size:1.05rem}.wrap{max-width:960px;margin:0 auto;padding:22px 16px 52px}.back{display:inline-block;color:#63338e;font-weight:800;text-decoration:none;margin-bottom:14px}.notice{background:white;border:2px solid #d6b8ec;border-radius:18px;padding:16px 18px;box-shadow:0 4px 13px #5e32751c}.notice p{margin:.3rem 0}.progress{height:13px;background:#e9dff1;border-radius:20px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff78ad,#9445ce);transition:.3s}.section{margin:28px 0 14px;background:linear-gradient(90deg,#8a3abb,#b94dd0);color:white;border-radius:13px;padding:12px 18px;font-size:1.18rem;font-weight:800}.card{background:#fff;border:2px solid #e8d3f6;border-radius:19px;padding:20px;margin:15px 0;box-shadow:0 5px 14px #4a286214}.card h2{font-size:1.1rem;margin:0 0 10px}.drawing{font-size:1.55rem;letter-spacing:.2rem;line-height:1.7;background:#fff2f8;border:2px dashed #e6a9cb;border-radius:12px;padding:10px 14px;display:inline-block}.answer-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:1.05rem;font-weight:700}input[type=text]{width:76px;border:2px solid #b88fda;border-radius:9px;padding:9px;text-align:center;font-size:1rem;color:var(--tinta)}.wide{width:150px!important}.choice{display:block;background:#faf5ff;border:1px solid #d9bce9;border-radius:10px;padding:9px;margin:8px 0}.check{margin-top:14px;border:0;border-radius:9px;background:#7434a8;color:white;font-size:1rem;font-weight:800;padding:10px 16px;cursor:pointer}.check:hover{background:#59227e}.feedback{margin:11px 0 0;font-weight:800;min-height:1.2em}.ok{color:var(--verde)}.bad{color:var(--rojo)}.wrong{border-color:var(--rojo)!important;background:#fff0f2}.right{border-color:var(--verde)!important;background:#effaf4}.submit{display:block;margin:28px auto 0;background:linear-gradient(90deg,#ff639f,#8b3bc1);color:white;border:0;border-radius:14px;padding:14px 25px;font-size:1.08rem;font-weight:900;cursor:pointer;box-shadow:0 5px 12px #9f418a55}.results{display:none;background:white;border:3px solid #56b687;border-radius:20px;margin-top:24px;padding:20px}.results h2{margin-top:0}.solution{border-top:1px solid #eaddef;padding:10px 0}.tag{font-weight:800}.reset{display:block;margin:16px auto 0;border:2px solid #7b3fac;background:white;color:#70349e;border-radius:10px;padding:9px 15px;font-weight:800;cursor:pointer}@media(max-width:600px){.card{padding:16px}.answer-line{font-size:.96rem}}
</style></head><body>
<header class="hero"><h1>✖️➗ Prueba interactiva</h1><p>Unidad 5: Multiplicación y División</p></header>
<main class="wrap"><a class="back" href="index.html">← Volver a Matemáticas</a>
<div class="notice"><strong>¡Vamos a practicar!</strong><p>Completa cada actividad. Puedes revisar una por una y al final verás tu puntaje y todas las soluciones.</p></div><div class="progress" aria-label="Avance"><span id="bar"></span></div><p id="advance"><strong>0 de 18</strong> actividades revisadas</p>
<div id="quiz"></div><button class="submit" onclick="finish()">Ver mi resultado y soluciones ✨</button>
<section class="results" id="results"></section><button class="reset" onclick="location.reload()">↻ Comenzar nuevamente</button>
</main>
<script>
const qs=[
{sec:"Parte I: Multiplicación — sumando el mismo número",t:"1a. Observa los grupos de flores. Completa la suma y la multiplicación.",draw:"🌸🌸🌸🌸    🌸🌸🌸🌸    🌸🌸🌸🌸",labels:["Suma repetida (ejemplo: 4+4+4)","Multiplicación (ejemplo: 3×4)","Resultado"],a:["4+4+4","3x4","12"],sol:"Hay 3 grupos de 4 flores: 4 + 4 + 4 = 12, por eso 3 × 4 = 12."},
{t:"1b. Observa los grupos de estrellas. Completa la suma y la multiplicación.",draw:"⭐️⭐️⭐️⭐️⭐️    ⭐️⭐️⭐️⭐️⭐️    ⭐️⭐️⭐️⭐️⭐️",labels:["Suma repetida","Multiplicación","Resultado"],a:["5+5+5","3x5","15"],sol:"Hay 3 grupos de 5 estrellas: 5 + 5 + 5 = 15; 3 × 5 = 15."},
{t:"2. ¿Cuántos grupos y corazones hay? Escribe la multiplicación.",draw:"💗💗💗    💗💗💗    💗💗💗    💗💗💗    💗💗💗",labels:["Cantidad de grupos","Corazones por grupo","Multiplicación","Resultado"],a:["5","3","5x3","15"],sol:"Hay 5 grupos con 3 corazones cada uno: 5 × 3 = 15."},
{sec:"Parte II: Historias de multiplicación",t:"3a. Seis grupos tienen 2 flores cada uno. Escribe la frase numérica.",draw:"🌸🌸   🌸🌸   🌸🌸   🌸🌸   🌸🌸   🌸🌸",labels:["Multiplicación","Resultado"],a:["6x2","12"],sol:"6 grupos de 2 flores: 6 × 2 = 12."},
{t:"3b. Tres grupos tienen 6 estrellas cada uno. Escribe la frase numérica.",draw:"⭐️⭐️⭐️⭐️⭐️⭐️    ⭐️⭐️⭐️⭐️⭐️⭐️    ⭐️⭐️⭐️⭐️⭐️⭐️",labels:["Multiplicación","Resultado"],a:["3x6","18"],sol:"3 grupos de 6 estrellas: 3 × 6 = 18."},
{t:"4. Marca las frases numéricas correctas.",type:"check",opts:["4 × 5 = 20","3 × 6 = 21","5 × 2 = 52","7 × 3 = 3 + 3 + 3 + 3 + 3 + 3 + 3"],a:["0","3"],sol:"Son correctas 4 × 5 = 20 y 7 × 3 = 3 sumado 7 veces."},
{sec:"Parte III: Problemas de multiplicación",t:"5. Josefina tiene 6 bolsitas de dulces. Cada bolsita tiene 5 dulces. ¿Cuántos dulces tiene en total?",labels:["Multiplicación","Total de dulces"],a:["6x5","30"],sol:"Son 6 grupos de 5: 6 × 5 = 30 dulces."},
{t:"6. Hay 4 canastos. En cada canasto hay 7 manzanas. ¿Cuántas manzanas hay en total?",labels:["Multiplicación","Total de manzanas"],a:["4x7","28"],sol:"Son 4 grupos de 7: 4 × 7 = 28 manzanas."},
{sec:"Parte IV: División — reparto equitativo",t:"7. Reparte 16 flores en 4 grupos iguales. ¿Cuántas flores recibe cada grupo?",labels:["16 ÷ 4 =","Flores por grupo"],a:["4","4"],sol:"16 repartido en 4 grupos iguales da 4: 16 ÷ 4 = 4."},
{t:"8. Valeria tiene 21 lápices y los reparte por igual entre 3 estuches. ¿Cuántos lápices hay en cada estuche?",labels:["21 ÷ 3 =","Lápices en cada estuche"],a:["7","7"],sol:"21 ÷ 3 = 7. Cada estuche recibe 7 lápices."},
{sec:"Parte V: Encuentra la cantidad de grupos",t:"9. Separa 18 estrellas en grupos de 6. ¿Cuántos grupos se forman?",labels:["18 ÷ 6 =","Cantidad de grupos"],a:["3","3"],sol:"18 ÷ 6 = 3; se forman 3 grupos de 6 estrellas."},
{t:"10. Emilia tiene 24 caramelos. Da 8 caramelos a cada amiga. ¿Cuántas amigas recibieron caramelos?",labels:["24 ÷ 8 =","Cantidad de amigas"],a:["3","3"],sol:"24 ÷ 8 = 3. Recibieron caramelos 3 amigas."},
{sec:"Parte VI: Resolución de problemas — mixto",t:"11. Hay 5 peceras. En cada pecera hay 6 peces. ¿Cuántos peces hay en total?",labels:["Multiplicación","Total de peces"],a:["5x6","30"],sol:"5 grupos de 6: 5 × 6 = 30 peces."},
{t:"12. Nicolás tiene 20 figuritas. Las reparte por igual entre 5 álbumes. ¿Cuántas figuritas pone en cada álbum?",labels:["20 ÷ 5 =","Figuritas en cada álbum"],a:["4","4"],sol:"20 ÷ 5 = 4; pone 4 figuritas en cada álbum."},
{t:"13. Hay 27 globos. Se guardan en bolsas con 9 globos cada una. ¿Cuántas bolsas se necesitan?",labels:["27 ÷ 9 =","Cantidad de bolsas"],a:["3","3"],sol:"27 ÷ 9 = 3; se necesitan 3 bolsas."},
{t:"14. Catalina tiene 3 floreros. Coloca 8 flores en cada uno. ¿Cuántas flores usó en total?",labels:["Multiplicación","Total de flores"],a:["3x8","24"],sol:"3 grupos de 8: 3 × 8 = 24 flores."},
{t:"Desafío extra. ¿Qué multiplicación comprueba que 24 ÷ 6 = 4?",labels:["Multiplicación que comprueba la división"],a:["4x6"],sol:"La división se comprueba multiplicando cociente por divisor: 4 × 6 = 24."},
{t:"Desafío extra. Escribe una suma repetida que represente 4 × 7.",labels:["Suma repetida"],a:["7+7+7+7"],sol:"4 × 7 significa 4 grupos de 7: 7 + 7 + 7 + 7 = 28."}
];
let reviewed=new Set(),score=0;
const norm=x=>(x||"").toLowerCase().replaceAll("×","x").replaceAll("÷","/").replace(/\s/g,"");
function render(){let out="",sec="";qs.forEach((q,i)=>{if(q.sec&&q.sec!==sec){sec=q.sec;out+='<div class="section">'+sec+'</div>'}out+='<article class="card" id="c'+i+'"><h2>'+q.t+'</h2>'+(q.draw?'<div class="drawing">'+q.draw+'</div>':'');if(q.type==="check"){q.opts.forEach((o,j)=>out+='<label class="choice"><input type="checkbox" name="q'+i+'" value="'+j+'"> '+o+'</label>')}else{q.labels.forEach((l,j)=>out+='<div class="answer-line"><label>'+l+'</label><input aria-label="'+l+'" type="text" data-q="'+i+'" data-a="'+j+'"></div>')}out+='<button class="check" onclick="check('+i+')">Revisar respuesta</button><p class="feedback" id="f'+i+'"></p></article>'});document.querySelector("#quiz").innerHTML=out}function check(i){let q=qs[i],card=document.querySelector("#c"+i),correct;if(q.type==="check"){let got=[...document.querySelectorAll('input[name="q'+i+'"]:checked')].map(x=>x.value).sort();correct=got.join(",")===q.a.join(",");document.querySelectorAll('input[name="q'+i+'"]').forEach(x=>x.closest("label").classList.toggle(q.a.includes(x.value)?"right":"wrong",!correct||!q.a.includes(x.value)))}else{let ins=[...card.querySelectorAll("input")];correct=ins.every((x,j)=>norm(x.value)===norm(q.a[j]));ins.forEach((x,j)=>x.classList.toggle(norm(x.value)===norm(q.a[j])?"right":"wrong",true))}let f=document.querySelector("#f"+i);f.className="feedback "+(correct?"ok":"bad");f.textContent=correct?"¡Muy bien! 🎉 Tu respuesta es correcta.":"Aún no. La respuesta correcta es: "+q.a.join(" | ");if(!reviewed.has(i)){reviewed.add(i);if(correct)score++}else if(correct){}update()}function update(){document.querySelector("#bar").style.width=(reviewed.size/qs.length*100)+"%";document.querySelector("#advance").innerHTML="<strong>"+reviewed.size+" de "+qs.length+"</strong> actividades revisadas"}function finish(){let html="<h2>Resultados de tu prueba ✨</h2><p><strong>Puntaje: "+score+" de "+qs.length+"</strong> actividades correctas en tu primera revisión.</p><h3>Soluciones</h3>";qs.forEach((q,i)=>{let pass=document.querySelector("#f"+i).classList.contains("ok");html+='<div class="solution"><span class="tag '+(pass?"ok":"bad")+'">'+(i+1)+". "+(pass?"Correcta ✓":"Por revisar")+"</span><br>"+q.sol+"</div>"});let box=document.querySelector("#results");box.innerHTML=html;box.style.display="block";box.scrollIntoView({behavior:"smooth"})}render();
</script></body></html>
