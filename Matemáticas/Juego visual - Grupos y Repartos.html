<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego visual: Grupos y Repartos</title><link rel="stylesheet" href="../estilos.css?v=fondo-paginas-20260905"><style>
.juego{max-width:860px;margin:auto}.cabecera{position:relative;text-align:center;margin-bottom:18px}.cabecera h1{color:#075c80;margin:8px 45px}.reiniciar{position:absolute;right:0;top:0;border:2px solid #2b9bb3;background:#fff;color:#075c80;width:43px;height:43px;border-radius:50%;font-size:24px;cursor:pointer}.progreso{font-weight:700;color:#6c4aa1}.barra{height:11px;background:#dceff4;border-radius:10px;overflow:hidden;margin:9px 0 20px}.barra i{display:block;height:100%;background:#46afc2}.pregunta{font-size:1.2rem;font-weight:700;color:#173f58;margin:14px 0}.dibujo{background:#f7fcfd;border:2px dashed #76bdcf;border-radius:18px;padding:18px;margin-bottom:18px;text-align:center;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.grupo,.reparto{background:#fff;border:2px solid #78bfcf;border-radius:14px;padding:8px 10px;font-size:1.5rem;line-height:1.45;min-width:88px}.reparto{border-color:#efbf58;background:#fff9e9}.opciones{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opcion{font:inherit;text-align:left;padding:14px;border:2px solid #c5dde4;border-radius:13px;background:#fff;color:#183e58;cursor:pointer}.opcion:hover:not(:disabled){border-color:#2b9bb3;background:#f3fcff}.opcion:disabled{cursor:default}.letra{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#e8f5f8;color:#0b6b83;font-weight:800;margin-right:9px}.correcta{background:#e7f8e9!important;border-color:#49a959!important;color:#195c28!important}.incorrecta{background:#ffeded!important;border-color:#d95151!important;color:#962c2c!important}.mensaje{margin-top:18px;padding:14px;border-radius:13px;font-weight:600;display:none}.bien{display:block;background:#e7f8e9;color:#185c28}.mal{display:block;background:#ffeded;color:#842626}.siguiente{display:none;margin:16px 0 0 auto;background:#137d9b;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.resultado{display:none;text-align:center}.resultado h2{color:#075c80}.nota{font-size:2.4rem;font-weight:800;color:#6c4aa1}.resumen{margin-top:20px;text-align:left}.fila{padding:10px;border-bottom:1px solid #d9e8ec}.ok{color:#1b7a35;font-weight:700}.no{color:#b43838;font-weight:700}@media(max-width:620px){.opciones{grid-template-columns:1fr}.grupo,.reparto{font-size:1.25rem}.cabecera h1{font-size:1.5rem}}</style></head><body class="asignatura-page"><main class="asignatura juego"><a class="volver" href="index.html">← Volver a Matemáticas</a><section class="panel"><div class="cabecera"><button class="reiniciar" onclick="reiniciar()" aria-label="Comenzar de nuevo">↻</button><h1>🎮 Juego visual: Grupos y Repartos</h1><p>Multiplica con sumas repetidas y divide repartiendo en partes iguales.</p></div><div id="juego"></div><div id="resultado" class="resultado"></div></section></main><script>
const etapas=[
{tema:"Suma repetida",p:"Mira los grupos de manzanas. ¿Qué multiplicación representa el dibujo?",d:'<div class="grupo">🍎🍎🍎🍎</div><div class="grupo">🍎🍎🍎🍎</div><div class="grupo">🍎🍎🍎🍎</div>',o:["3 × 4 = 12","4 × 3 = 7","3 + 4 = 7","12 ÷ 3 = 3"],a:0,e:"Hay 3 grupos de 4 manzanas: 4 + 4 + 4 = 12."},
{tema:"Suma repetida",p:"¿Cuál suma repetida muestra 4 grupos de 3 globos?",d:'<div class="grupo">🎈🎈🎈</div><div class="grupo">🎈🎈🎈</div><div class="grupo">🎈🎈🎈</div><div class="grupo">🎈🎈🎈</div>',o:["3 + 3 + 3 + 3 = 12","4 + 4 + 4 = 12","3 + 4 = 7","12 ÷ 4 = 4"],a:0,e:"Se suma el 3 cuatro veces: 3 + 3 + 3 + 3 = 12."},
{tema:"Grupos iguales",p:"Cada caja tiene 5 lápices. Hay 3 cajas. ¿Cuántos lápices hay en total?",d:'<div class="grupo">✏️✏️✏️✏️✏️</div><div class="grupo">✏️✏️✏️✏️✏️</div><div class="grupo">✏️✏️✏️✏️✏️</div>',o:["8","10","15","20"],a:2,e:"Son 3 grupos de 5: 5 + 5 + 5 = 15."},
{tema:"Multiplicación",p:"Hay 5 platos con 2 galletas cada uno. ¿Qué operación ayuda a saber cuántas galletas hay?",d:'<div class="grupo">🍪🍪</div><div class="grupo">🍪🍪</div><div class="grupo">🍪🍪</div><div class="grupo">🍪🍪</div><div class="grupo">🍪🍪</div>',o:["5 × 2 = 10","5 + 2 = 7","10 ÷ 2 = 2","2 × 2 = 4"],a:0,e:"Hay 5 grupos de 2 galletas: 2 + 2 + 2 + 2 + 2 = 10."},
{tema:"Reparto equitativo",p:"Se reparten 24 dulces en 6 bolsas iguales. ¿Cuántos dulces recibe cada bolsa?",d:'<div class="reparto">🍬 🍬 🍬 🍬</div><div class="reparto">🍬 🍬 🍬 🍬</div><div class="reparto">🍬 🍬 🍬 🍬</div><div class="reparto">🍬 🍬 🍬 🍬</div><div class="reparto">🍬 🍬 🍬 🍬</div><div class="reparto">🍬 🍬 🍬 🍬</div>',o:["3","4","5","6"],a:1,e:"24 ÷ 6 = 4. Cada bolsa queda con 4 dulces."},
{tema:"Reparto equitativo",p:"Hay 18 crayones para 3 estuches. ¿Cuál reparto es justo?",d:'<div class="reparto">🖍️🖍️🖍️🖍️🖍️🖍️</div><div class="reparto">🖍️🖍️🖍️🖍️🖍️🖍️</div><div class="reparto">🖍️🖍️🖍️🖍️🖍️🖍️</div>',o:["3 en cada estuche","5 en cada estuche","6 en cada estuche","9 en cada estuche"],a:2,e:"18 ÷ 3 = 6. Todos los estuches reciben la misma cantidad."},
{tema:"Formar grupos",p:"Hay 20 botones. Si se forman grupos de 5 botones, ¿cuántos grupos se pueden hacer?",d:'<div class="grupo">🔵🔵🔵🔵🔵</div><div class="grupo">🔵🔵🔵🔵🔵</div><div class="grupo">🔵🔵🔵🔵🔵</div><div class="grupo">🔵🔵🔵🔵🔵</div>',o:["3 grupos","4 grupos","5 grupos","10 grupos"],a:1,e:"20 ÷ 5 = 4. Se forman 4 grupos iguales."},
{tema:"División",p:"Una profesora reparte 16 naranjas entre 4 canastos. ¿Cuántas naranjas quedan en cada canasto?",d:'<div class="reparto">🍊🍊🍊🍊</div><div class="reparto">🍊🍊🍊🍊</div><div class="reparto">🍊🍊🍊🍊</div><div class="reparto">🍊🍊🍊🍊</div>',o:["2","3","4","5"],a:2,e:"16 ÷ 4 = 4. Cada canasto recibe 4 naranjas."},
{tema:"Comprobar",p:"Si 4 × 5 = 20, ¿qué división comprueba esa multiplicación?",d:'<div class="grupo">⭐️⭐️⭐️⭐️⭐️</div><div class="grupo">⭐️⭐️⭐️⭐️⭐️</div><div class="grupo">⭐️⭐️⭐️⭐️⭐️</div><div class="grupo">⭐️⭐️⭐️⭐️⭐️</div>',o:["20 ÷ 4 = 5","20 ÷ 5 = 3","5 ÷ 4 = 20","4 ÷ 5 = 1"],a:0,e:"20 objetos repartidos en 4 grupos dejan 5 en cada grupo."},
{tema:"Elegir la operación",p:"Camila tiene 4 filas con 6 flores en cada una. ¿Qué debe hacer para saber el total?",d:'<div class="grupo">🌼🌼🌼🌼🌼🌼</div><div class="grupo">🌼🌼🌼🌼🌼🌼</div><div class="grupo">🌼🌼🌼🌼🌼🌼</div><div class="grupo">🌼🌼🌼🌼🌼🌼</div>',o:["Sumar 4 + 6","Multiplicar 4 × 6","Dividir 6 ÷ 4","Restar 6 - 4"],a:1,e:"Hay 4 grupos de 6. La multiplicación 4 × 6 permite hallar 24 flores."}];
let actual=0,puntaje=0,respuestas=[];function letra(i){return["a","b","c","d"][i]}function render(){const x=etapas[actual];document.getElementById("resultado").style.display="none";document.getElementById("juego").innerHTML='<div class="progreso">Misión '+(actual+1)+' de '+etapas.length+' · '+x.tema+'</div><div class="barra"><i style="width:'+(actual/etapas.length*100)+'%"></i></div><div class="pregunta">'+x.p+'</div><div class="dibujo">'+x.d+'</div><div class="opciones">'+x.o.map(function(v,i){return'<button class="opcion" onclick="responder('+i+')" id="op'+i+'"><span class="letra">'+letra(i)+')</span>'+v+'</button>'}).join("")+'</div><div id="mensaje" class="mensaje"></div><button id="siguiente" class="siguiente" onclick="avanzar()">'+(actual===etapas.length-1?"Ver resultados":"Siguiente misión →")+'</button>'}function responder(i){const x=etapas[actual];if(respuestas[actual]!==undefined)return;respuestas[actual]=i;const bien=i===x.a;if(bien)puntaje++;for(let n=0;n<x.o.length;n++){const b=document.getElementById("op"+n);b.disabled=true;if(n===x.a)b.classList.add("correcta");if(n===i&&!bien)b.classList.add("incorrecta")}const m=document.getElementById("mensaje");m.className="mensaje "+(bien?"bien":"mal");m.textContent=(bien?"¡Muy bien! 🎉 ":"Casi. ")+x.e;document.getElementById("siguiente").style.display="block"}function avanzar(){actual++;if(actual<etapas.length)render();else terminar()}function terminar(){document.getElementById("juego").innerHTML="";const nota=(1+6*puntaje/etapas.length).toFixed(1).replace(".",",");const filas=etapas.map(function(x,i){const bien=respuestas[i]===x.a;return'<div class="fila"><span class="'+(bien?"ok":"no")+'">'+(bien?"✓ Correcta":"✗ Incorrecta")+'</span> · '+(i+1)+". "+x.e+"</div>"}).join("");const r=document.getElementById("resultado");r.style.display="block";r.innerHTML="<h2>¡Juego terminado!</h2><p>Lograste <strong>"+puntaje+" de "+etapas.length+"</strong> misiones.</p><div class='nota'>Nota: "+nota+"</div><div class='resumen'><h3>Soluciones</h3>"+filas+"</div>"}function reiniciar(){actual=0;puntaje=0;respuestas=[];render()}render();
</script></body></html>
