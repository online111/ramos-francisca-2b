<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía interactiva | Matemáticas</title>
<style>
:root{--morado:#7434a8;--violeta:#9a55d3;--rosado:#f064a5;--tinta:#302348;--verde:#198a59;--rojo:#d74a57;--crema:#fff9fd}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--tinta);font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#fff4fb,#f0e9ff 48%,#e8fbfb)}.hero{position:relative;padding:28px 56px 32px;text-align:center;color:#fff;background:linear-gradient(100deg,var(--morado),var(--rosado));box-shadow:0 4px 16px #693a8552}.hero h1{margin:0;font-size:clamp(1.55rem,5vw,2.45rem)}.hero p{margin:.55rem 0 0;font-size:1.02rem}.restart{position:absolute;top:18px;right:18px;width:42px;height:42px;border:2px solid #fff;border-radius:50%;background:#ffffff2c;color:#fff;font-size:1.45rem;font-weight:bold;cursor:pointer}.restart:hover{background:#ffffff4d}.wrap{max-width:780px;margin:auto;padding:22px 16px 54px}.back{display:inline-block;margin-bottom:15px;color:#63338e;font-weight:800;text-decoration:none}.intro,.quiz-card,.results{background:#fff;border:2px solid #e3c9f0;border-radius:20px;box-shadow:0 6px 18px #4c2a5c18}.intro{padding:15px 18px}.intro p{margin:.35rem 0}.progress{height:14px;overflow:hidden;margin:19px 0 7px;border-radius:20px;background:#e9def3}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--rosado),var(--violeta));transition:width .28s}.counter{margin:0 0 15px;font-weight:800}.quiz-card{padding:24px}.type{display:inline-block;margin:0 0 12px;padding:7px 12px;border-radius:999px;background:#f2e7fa;color:#6d309a;font-size:.88rem;font-weight:800}.quiz-card h2{margin:0 0 12px;font-size:1.3rem;line-height:1.36}.drawing{margin:13px 0 16px;padding:13px 16px;border:2px dashed #dda8cc;border-radius:14px;background:#fff1f8;font-size:1.55rem;line-height:1.65;letter-spacing:.12rem;text-align:center}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:2px solid #d9bce9;border-radius:13px;background:#fcf8ff;color:var(--tinta);text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:.15s}.option-visual{display:inline-block;min-width:104px;padding:5px 8px;border-radius:9px;background:#fff0f7;color:#713b6b;font-size:1.08rem;line-height:1.4;letter-spacing:.04rem;text-align:center}.option-copy{line-height:1.35}.letter{display:inline-grid;place-items:center;flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:#7b3fac;color:#fff;font-weight:900;font-size:1rem}.choice:hover:not(:disabled){transform:translateY(-1px);border-color:#a65ccc}.choice:disabled{cursor:default}.choice.correct{border-color:var(--verde);background:#eaf8f0;color:#11653f}.choice.incorrect{border-color:var(--rojo);background:#fff0f2;color:#9d2937}.feedback{min-height:1.4em;margin:16px 0 0;font-weight:800}.feedback.ok{color:var(--verde)}.feedback.bad{color:var(--rojo)}.next{display:none;margin-top:17px;padding:11px 17px;border:0;border-radius:11px;background:var(--morado);color:#fff;font:inherit;font-weight:800;cursor:pointer}.next:hover{background:#59227e}.results{display:none;margin-top:18px;padding:23px}.results h2{margin-top:0}.score{padding:14px;border-radius:14px;background:#f1e8fb;font-size:1.08rem}.summary{margin-top:16px}.summary article{padding:13px 0;border-top:1px solid #eadff0}.summary strong{display:block}.good{color:var(--verde)}.needs{color:var(--rojo)}@media(max-width:560px){.hero{padding-left:46px;padding-right:46px}.quiz-card{padding:19px}.drawing{font-size:1.25rem}}
</style></head>
<body>
<header class="hero"><button class="restart" title="Comenzar de nuevo" aria-label="Comenzar de nuevo" onclick="restart()">↺</button><h1>➗ Guía de Ejercicios Interactiva</h1><p>Multiplicación y división - 30 ejercicios de multiplicación y división</p></header>
<main class="wrap"><a class="back" href="index.html">← Volver a Matemáticas</a>
<section class="intro"><strong>¡A practicar!</strong><p>Elige una alternativa. Verás de inmediato si acertaste y, al final, podrás revisar todas las soluciones.</p></section>
<div class="progress" aria-label="Avance de la guía"><span id="bar"></span></div><p class="counter" id="counter"></p>
<section class="quiz-card" id="card"></section><section class="results" id="results"></section>
</main>
<script>
const qs=[
{type:"1. Suma repetida",q:"¿Qué multiplicación representa 5 + 5 + 5 + 5?",draw:"🍎🍎🍎🍎🍎   🍎🍎🍎🍎🍎   🍎🍎🍎🍎🍎   🍎🍎🍎🍎🍎",opts:["<span class='option-visual'>🍎🍎🍎🍎<br>🍎🍎🍎🍎<br>🍎🍎🍎🍎<br>🍎🍎🍎🍎<br>🍎🍎🍎🍎</span><span class='option-copy'>5 grupos de 4<br><strong>5 × 4 = 20</strong></span>","<span class='option-visual'>🍎🍎🍎🍎🍎<br>🍎🍎🍎🍎🍎<br>🍎🍎🍎🍎🍎<br>🍎🍎🍎🍎🍎</span><span class='option-copy'>4 grupos de 5<br><strong>4 × 5 = 20</strong></span>","<span class='option-visual'>🍎🍎🍎🍎<br>🍎🍎🍎🍎<br>🍎🍎🍎🍎<br>🍎🍎🍎🍎</span><span class='option-copy'>4 × 4 = 16</span>","<span class='option-visual'>🍎🍎🍎🍎🍎<br>🍎🍎🍎🍎🍎</span><span class='option-copy'>2 × 5 = 10</span>"],a:1,sol:"Hay 4 grupos de 5: 4 × 5 = 20."},
{type:"2. Suma a multiplicación",q:"¿Cuál multiplicación representa 3 + 3 + 3 + 3 + 3?",opts:["3 × 5 = 15","5 × 3 = 15","3 × 3 = 9","5 + 3 = 8"],a:1,sol:"Hay 5 sumandos iguales a 3: 5 × 3 = 15."},
{type:"3. Grupos iguales",q:"Hay 4 vasos y cada vaso tiene 6 flores. ¿Cuántas flores hay?",draw:"🌷🌷🌷🌷🌷🌷   🌷🌷🌷🌷🌷🌷   🌷🌷🌷🌷🌷🌷   🌷🌷🌷🌷🌷🌷",opts:["10","20","24","28"],a:2,sol:"Son 4 grupos de 6 flores: 4 × 6 = 24."},
{type:"4. Filas y columnas",q:"Hay 3 filas con 8 estrellas en cada una. ¿Qué operación corresponde?",opts:["3 + 8","3 × 8","8 ÷ 3","8 - 3"],a:1,sol:"Tres filas de ocho son 3 grupos de 8: 3 × 8."},
{type:"5. Factor faltante",q:"Completa: 7 × ___ = 28.",opts:["3","4","5","6"],a:1,sol:"7 × 4 = 28."},
{type:"6. Resultado de multiplicación",q:"¿Cuánto es 6 × 5?",opts:["11","25","30","35"],a:2,sol:"6 grupos de 5 dan 30."},
{type:"7. Problema de multiplicación",q:"Sofía tiene 5 cajas. En cada caja guarda 4 lápices. ¿Cuántos lápices guarda?",opts:["9","15","20","25"],a:2,sol:"Son 5 grupos de 4: 5 × 4 = 20."},
{type:"8. Problema de multiplicación",q:"En 7 mesas hay 3 niños sentados en cada una. ¿Cuántos niños hay?",opts:["10","18","21","24"],a:2,sol:"7 × 3 = 21 niños."},
{type:"9. Historia de multiplicación",q:"¿Qué historia representa 4 × 6?",opts:["Cuatro bolsas con 6 dulces cada una.","Cuatro dulces y seis más.","Se reparten 24 dulces entre 6 bolsas.","Hay seis bolsas con cuatro dulces en total."],a:0,sol:"4 × 6 representa 4 grupos de 6."},
{type:"10. Comparar representaciones",q:"¿Cuál suma repetida representa 8 × 2?",opts:["8 + 2","2 + 2 + 2 + 2 + 2 + 2 + 2 + 2","8 + 8","2 × 8"],a:1,sol:"8 × 2 son 8 grupos de 2: el 2 se suma 8 veces."},
{type:"11. Dibujo y total",q:"Hay 5 grupos de 3 globos. ¿Cuál es el total?",draw:"🎈🎈🎈   🎈🎈🎈   🎈🎈🎈   🎈🎈🎈   🎈🎈🎈",opts:["8","12","15","20"],a:2,sol:"5 × 3 = 15 globos."},
{type:"12. Operación adecuada",q:"Para saber cuántas patas tienen 4 perros, ¿qué operación usarías?",opts:["4 + 4","4 × 4","4 ÷ 4","4 - 4"],a:1,sol:"Cada perro tiene 4 patas: 4 grupos de 4, o 4 × 4."},
{type:"13. Reparto equitativo",q:"Se reparten 18 galletas en 3 platos iguales. ¿Cuántas recibe cada plato?",opts:["5","6","7","9"],a:1,sol:"18 ÷ 3 = 6 galletas por plato."},
{type:"14. Reparto con dibujo",q:"24 frutas se reparten en 6 canastos iguales. ¿Cuántas frutas van en cada canasto?",draw:"🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊🍊",opts:["3","4","5","6"],a:1,sol:"24 ÷ 6 = 4. Cada canasto recibe 4 frutas."},
{type:"15. Cantidad de grupos",q:"Hay 20 lápices y se hacen grupos de 5. ¿Cuántos grupos se forman?",opts:["3","4","5","6"],a:1,sol:"20 ÷ 5 = 4 grupos."},
{type:"16. Cantidad por grupo",q:"30 caramelos se reparten por igual entre 5 niños. ¿Cuántos caramelos recibe cada niño?",opts:["5","6","7","8"],a:1,sol:"30 ÷ 5 = 6 caramelos."},
{type:"17. División exacta",q:"¿Cuánto es 28 ÷ 4?",opts:["6","7","8","9"],a:1,sol:"28 ÷ 4 = 7."},
{type:"18. Problema de división",q:"Martín tiene 27 láminas y pone 9 en cada álbum. ¿Cuántos álbumes completa?",opts:["2","3","4","6"],a:1,sol:"27 ÷ 9 = 3 álbumes."},
{type:"19. Problema de reparto",q:"16 flores se distribuyen por igual en 4 floreros. ¿Cuántas flores quedan en cada florero?",opts:["2","3","4","5"],a:2,sol:"16 ÷ 4 = 4 flores en cada florero."},
{type:"20. Elegir la división",q:"¿Qué operación resuelve: “Hay 32 botones y se colocan 8 en cada bolsa”?",opts:["32 × 8","32 + 8","32 ÷ 8","32 - 8"],a:2,sol:"Se conoce el total y la cantidad por bolsa; se divide 32 ÷ 8."},
{type:"21. Dibujo de división",q:"Se forman grupos de 4 con 20 semillas. ¿Cuántos grupos habrá?",opts:["4","5","6","8"],a:1,sol:"20 ÷ 4 = 5 grupos."},
{type:"22. Comprobación",q:"¿Qué multiplicación comprueba que 24 ÷ 6 = 4?",opts:["6 × 6 = 36","4 × 6 = 24","24 × 6 = 144","4 + 6 = 10"],a:1,sol:"El resultado por el divisor debe dar el total: 4 × 6 = 24."},
{type:"23. Familia de operaciones",q:"Si 3 × 7 = 21, ¿cuál división es correcta?",opts:["21 ÷ 3 = 7","21 ÷ 7 = 3 y ninguna otra","3 ÷ 7 = 21","21 ÷ 3 = 6"],a:0,sol:"21 ÷ 3 = 7. También es cierto que 21 ÷ 7 = 3."},
{type:"24. Número faltante en división",q:"Completa: ___ ÷ 5 = 6.",opts:["11","25","30","35"],a:2,sol:"30 ÷ 5 = 6."},
{type:"25. Operación mixta",q:"Hay 6 cajas con 4 pelotas cada una. Luego se reparten las 24 pelotas entre 3 equipos. ¿Cuántas pelotas recibe cada equipo?",opts:["6","8","12","21"],a:1,sol:"Primero 6 × 4 = 24. Después 24 ÷ 3 = 8."},
{type:"26. Verdadero o falso",q:"¿Cuál afirmación es verdadera?",opts:["5 × 4 = 18","6 × 3 = 18","18 ÷ 3 = 5","4 × 4 = 20"],a:1,sol:"6 × 3 = 18."},
{type:"27. Grupos de objetos",q:"¿Cuál dibujo representa 3 grupos de 4?",opts:["🍓🍓🍓   🍓🍓🍓   🍓🍓🍓   🍓🍓🍓","🍓🍓🍓🍓   🍓🍓🍓🍓   🍓🍓🍓🍓","🍓🍓🍓🍓🍓🍓🍓🍓🍓🍓🍓","🍓🍓🍓🍓   🍓🍓🍓🍓"],a:1,sol:"Tres grupos, cada uno con cuatro fresas, se muestran en la alternativa b)."},
{type:"28. Desafío de multiplicación",q:"Una araña tiene 8 patas. ¿Cuántas patas tienen 3 arañas?",opts:["11","16","24","32"],a:2,sol:"3 × 8 = 24 patas."},
{type:"29. Desafío de división",q:"36 libros se ordenan en 6 estantes iguales. ¿Cuántos libros se colocan en cada estante?",opts:["5","6","7","8"],a:1,sol:"36 ÷ 6 = 6 libros por estante."},
{type:"30. Revisión final",q:"¿Qué frase numérica resuelve: “4 equipos tienen 7 jugadores cada uno”?",opts:["4 + 7 = 11","4 × 7 = 28","28 ÷ 7 = 3","7 - 4 = 3"],a:1,sol:"Son 4 grupos de 7 jugadores: 4 × 7 = 28."}
];
let current=0,answers=Array(qs.length).fill(null);
function render(){const q=qs[current],answered=answers[current]!==null;document.querySelector('#bar').style.width=(current/qs.length*100)+'%';document.querySelector('#counter').textContent='Actividad '+(current+1)+' de '+qs.length;let html='<p class="type">'+q.type+'</p><h2>'+q.q+'</h2>'+(q.draw?'<div class="drawing">'+q.draw+'</div>':'')+'<div class="choices">';q.opts.forEach((o,i)=>{let cls='choice';if(answered){if(i===q.a)cls+=' correct';else if(i===answers[current])cls+=' incorrect'}let letter=String.fromCharCode(97+i)+')';html+='<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="answer('+i+')"><span class="letter">'+letter+'</span>'+o+'</button>'});html+='</div><p class="feedback '+(answered?(answers[current]===q.a?'ok':'bad'):'')+'">'+(answered?(answers[current]===q.a?'¡Muy bien! 🎉 Esa alternativa es correcta.':'No era esa. La alternativa verde es la correcta.'):'')+'</p>';if(answered)html+='<button class="next" style="display:inline-block" onclick="next()">'+(current===qs.length-1?'Ver resultado y soluciones ✨':'Siguiente actividad →')+'</button>';document.querySelector('#card').innerHTML=html}
function answer(i){answers[current]=i;render()}
function next(){if(current<qs.length-1){current++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){const correct=answers.filter((a,i)=>a===qs[i].a).length,grade=(1+correct/qs.length*6).toFixed(1).replace('.',',');document.querySelector('#bar').style.width='100%';document.querySelector('#counter').textContent='Guía completada';let html='<h2>Resultado de la guía ✨</h2><div class="score"><strong>Puntaje: '+correct+' de '+qs.length+'</strong><br>Nota: <strong>'+grade+'</strong> (escala de 1,0 a 7,0)</div><div class="summary"><h3>Revisión de tus respuestas</h3>';qs.forEach((q,i)=>{const ok=answers[i]===q.a;html+='<article><strong class="'+(ok?'good':'needs')+'">'+(i+1)+'. '+(ok?'Correcta ✓':'Incorrecta ✗')+'</strong><span>'+q.sol+'</span></article>'});html+='</div>';const res=document.querySelector('#results');res.innerHTML=html;res.style.display='block';res.scrollIntoView({behavior:'smooth'})}
function restart(){current=0;answers=Array(qs.length).fill(null);document.querySelector('#results').style.display='none';render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
