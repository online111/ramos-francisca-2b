rder-radius:9px}.ok{border-color:#228b4e;background:#e8f8ed}.no{border-color:#d43b3b;background:#ffe9e9}.item p{margin:4px 0 0;font-size:.94rem}@media(max-width:520px){.prueba{padding:18px}}</style></head><body class="asignatura-page"><main class="asignatura"><a class="volver" href="index.html">← Volver a Prueba 2</a><section class="prueba"><button class="reiniciar" onclick="reiniciar()" aria-label="Comenzar nuevamente">↻</button><h1>🌦️ Prueba Interactiva El Tiempo Atmosférico - Cami</h1><p>32 preguntas sobre tiempo atmosférico, precipitaciones, temperatura y viento.</p><div id="juego"></div><div id="resultado" class="resultado"></div></section></main><script>const P=[["☀️","¿Qué condición del tiempo representa este símbolo?",["Despejado","Nublado","Chubascos"],0,"El Sol representa tiempo despejado."],["☁️","¿Qué condición del tiempo representa este símbolo?",["Nublado","Despejado","Nieve"],0,"Las nubes indican tiempo nublado."],["🌦️","¿Qué condición del tiempo representa este símbolo?",["Nublado y chubascos","Nublado","Despejado"],0,"La lluvia bajo las nubes indica chubascos."],["🌨️","¿Qué condición del tiempo representa este símbolo?",["Nublado y chubascos con nieve","Nublado y chubascos","Despejado"],0,"La nieve cayendo indica chubascos con nieve."],["","¿Qué es el tiempo atmosférico?",["Las condiciones de la atmósfera en un lugar y momento","Las horas del reloj","Los días de la semana"],0,"Describe cómo está la atmósfera en un lugar y momento."],["","¿Qué es la atmósfera?",["La capa de aire que rodea la Tierra","El agua de los océanos","Una nube muy grande"],0,"La atmósfera es la capa de aire que rodea nuestro planeta."],["☁️","¿Cómo se originan las nubes?",["Por condensación del vapor de agua","Por evaporación del agua líquida","Por derretimiento del hielo"],0,"El vapor se enfría, se condensa y forma gotitas."],["🌧️","¿Qué son las precipitaciones?",["Agua que cae desde la atmósfera","El movimiento del aire","Lo caliente del ambiente"],0,"La lluvia, nieve y granizo son precipitaciones."],["🌧️","Las gotitas se juntan, forman gotas grandes y caen. ¿Qué precipitación es?",["Lluvia","Nieve","Granizo"],0,"Las gotas grandes de agua líquida forman la lluvia."],["🧊","Las gotitas se transforman en hielo dentro de la nube. ¿Qué precipitación es?",["Granizo","Lluvia","Nieve"],0,"El granizo son bolitas de hielo."],["❄️","¿Cuándo es más probable que nieve?",["Cuando la temperatura es muy baja","Cuando hace mucho calor","Cuando está despejado"],0,"La nieve se forma con temperaturas muy bajas."],["🌬️","¿Qué es el viento?",["El movimiento del aire","El agua que cae de las nubes","La luz del Sol"],0,"El viento es aire en movimiento."],["🌡️","¿Qué es la temperatura?",["Una medida de lo frío o caliente del ambiente","La cantidad de lluvia","La dirección del viento"],0,"Mide qué tan frío o caliente está algo."],["🌧️","¿Qué instrumento mide la lluvia caída?",["Pluviómetro","Termómetro","Veleta"],0,"El pluviómetro mide el agua de lluvia."],["🧭","¿Qué muestra la veleta?",["La dirección del viento","La velocidad del viento","La temperatura"],0,"La veleta indica hacia dónde sopla el viento."],["💨","¿Qué mide el anemómetro?",["La velocidad del viento","La dirección del viento","La lluvia"],0,"El anemómetro mide qué tan rápido sopla el viento."],["📅","Pronóstico: lunes despejado, martes lluvia y miércoles nublado. ¿Qué día conviene usar paraguas?",["Martes","Lunes","Miércoles"],0,"El paraguas sirve cuando hay lluvia."],["🌡️","Se midieron 12 °C a las 9:00, 18 °C a las 12:00 y 23 °C a las 16:00. ¿Cuándo fue más alta?",["A las 16:00","A las 9:00","A las 12:00"],0,"23 °C es la temperatura más alta."],["🪁","¿En qué situación se observa el efecto del viento?",["Un volantín volando","Una piedra quieta","Un libro cerrado"],0,"El viento permite que un volantín vuele."],["🍂","¿En qué estación algunos árboles comienzan a perder hojas?",["Otoño","Verano","Primavera"],0,"En otoño muchos árboles pierden sus hojas."],["🧊","Caen bolitas de hielo: granizo. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],0,"El granizo es una precipitación sólida."],["🌧️","Las gotitas de las nubes se hacen pesadas y caen. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],0,"La lluvia es una precipitación líquida."],["❄️","Caen copos de nieve. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],0,"La nieve es una precipitación sólida."],["🌧️","El pluviómetro mide cuánta agua cayó. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],0,"El pluviómetro se usa para medir precipitaciones."],["🌡️","El termómetro mide qué tan caliente está el ambiente. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],1,"El termómetro mide temperatura."],["🌡️","A las 16:00 hace más calor que a las 9:00. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],1,"Frío y calor se relacionan con la temperatura."],["🧥","Me pongo parka porque hace mucho frío. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],1,"La ropa abrigada se usa cuando la temperatura es baja."],["🌱","Riego las plantas en un día caluroso. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],1,"Un día caluroso tiene temperatura alta."],["🍃","Las hojas vuelan por el aire. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],2,"Las hojas se mueven por el viento."],["🪁","El volantín sube al cielo. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],2,"El volantín vuela gracias al viento."],["🧭","La veleta muestra hacia dónde sopla. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],2,"La veleta informa sobre el viento."],["💨","El anemómetro mide qué tan rápido sopla. ¿A qué se relaciona?",["Precipitaciones","Temperatura","Viento"],2,"El anemómetro mide la velocidad del viento."]];let n=0,p=0,r=[];function dibujar(){let q=P[n];document.getElementById("resultado").style.display="none";document.getElementById("juego").innerHTML='<p><b>Pregunta '+(n+1)+' de '+P.length+'</b></p><div class="progreso"><i style="width:'+(n/P.length*100)+'%"></i></div>'+(q[0]?'<div class="simbolo">'+q[0]+'</div>':'')+'<p class="pregunta">'+q[1]+'</p><div class="opciones">'+q[2].map((x,i)=>'<button class="opcion" id="o'+i+'" onclick="responder('+i+')"><span class="letra">'+["a","b","c"][i]+')</span>'+x+'</button>').join("")+'</div><div id="m" class="mensaje"></div><button id="s" class="siguiente" onclick="sig()">'+(n===P.length-1?"Ver resultado":"Siguiente →")+'</button>'}function responder(i){if(r[n]!==undefined)return;let q=P[n],b=i===q[3];r[n]=i;if(b)p++;q[2].forEach((_,j)=>{let x=document.getElementById("o"+j);x.disabled=true;if(j===q[3])x.classList.add("correcta");if(j===i&&!b)x.classList.add("incorrecta")});let m=document.getElementById("m");m.className="mensaje "+(b?"bien":"mal");m.textContent=(b?"¡Muy bien! 🎉 ":"Casi. ")+q[4];document.getElementById("s").style.display="block"}function sig(){n++;if(n<P.length)dibujar();else fin()}function fin(){document.getElementById("juego").innerHTML="";let nota=(1+6*p/P.length).toFixed(1).replace(".",",");let lista=P.map((q,i)=>{let b=r[i]===q[3];return '<div class="item '+(b?"ok":"no")+'"><b>'+(i+1)+'. '+(b?"✓ Correcta":"✗ Incorrecta")+'</b><p><b>Respuesta:</b> '+q[2][q[3]]+'. '+q[4]+'</p></div>'}).join("");let z=document.getElementById("resultado");z.style.display="block";z.innerHTML='<h2>¡Prueba terminada!</h2><strong>'+p+' de '+P.length+' respuestas correctas</strong><p class="nota">Nota: '+nota+' (escala de 1,0 a 7,0)</p><section class="revision"><h3>Revisión y soluciones</h3>'+lista+'</section>'}function reiniciar(){n=0;p=0;r=[];dibujar()}dibujar();</script></body></html>
